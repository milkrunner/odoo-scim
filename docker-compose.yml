services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./addons/auth_scim:/opt/odoo/addons/auth_scim
    command:
      - "--db_host=db"
      - "--db_port=5432"
      - "--db_user=odoo"
      - "--db_password=odoo"
      - "--database=odoo_scim_test"
      - "--init=auth_scim"
      - "--addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons"
      - "--without-demo"
      - "--http-interface=0.0.0.0"
      - "--proxy-mode"

volumes:
  pgdata:
